name: Soundness

on:
  pull_request:
  workflow_dispatch:

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.17
    with:
      api_breakage_check_container_image: swift:latest
      api_breakage_pre_build_command: |
        apt-get update
        apt-get install -y libedit-dev
      docs_check_container_image: swift:latest
      unacceptable_language_check_enabled: false  # Valkey commands contain unacceptable language
